name: Build Easy3D

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    continue-on-error: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore src/Easy3D.sln

    - name: Build
      run: dotnet build src/Easy3D.sln -c Release --no-restore

    - name: Publish
      run: dotnet publish src/Easy3D/Easy3D.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/${{ matrix.rid }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Easy3D-${{ matrix.rid }}
        path: publish/${{ matrix.rid }}/
