name: Build Easy3D

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    
    - name: Restore dependencies
      run: dotnet restore src/Easy3D.sln
    
    - name: Build
      run: dotnet build src/Easy3D.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test src/Easy3D.sln --configuration Release --no-build --verbosity normal
    
    - name: Publish Windows
      if: matrix.os == 'windows-latest'
      run: dotnet publish src/Easy3D -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/windows-x64
    
    - name: Publish Linux
      if: matrix.os == 'ubuntu-latest'
      run: dotnet publish src/Easy3D -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/linux-x64
    
    - name: Publish macOS
      if: matrix.os == 'macos-latest'
      run: dotnet publish src/Easy3D -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/osx-x64
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Easy3D-${{ matrix.os }}
        path: publish/
