name: Release Easy3D

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: macos-13
            rid: osx-x64
            ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish
      run: dotnet publish src/Easy3D/Easy3D.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output

    - name: Pack Windows
      if: matrix.ext == 'zip'
      run: Compress-Archive -Path output/* -DestinationPath Easy3D-${{ matrix.rid }}.zip
      shell: pwsh

    - name: Pack Unix
      if: matrix.ext == 'tar.gz'
      run: tar -czf Easy3D-${{ matrix.rid }}.tar.gz -C output .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Easy3D-${{ matrix.rid }}
        path: Easy3D-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
        generate_release_notes: true
